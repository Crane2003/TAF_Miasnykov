name: "Build, Test and Analyze"
description: "Restores, builds, tests and runs SonarCloud analysis for the TAF solution."

inputs:
  sonar-token:
    description: "SonarCloud authentication token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Java
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
      with:
        java-version: 21
        distribution: 'zulu'

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Cache SonarCloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache SonarCloud scanner
      id: cache-sonar-scanner
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/scanner
        key: ${{ runner.os }}-sonar-scanner
        restore-keys: ${{ runner.os }}-sonar-scanner

    - name: Install SonarCloud scanner
      if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory -Force
        dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

    - name: Begin SonarCloud analysis
      shell: pwsh
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        ${{ runner.temp }}/scanner/dotnet-sonarscanner begin /k:"Crane2003_TAF_Miasnykov" /o:"crane2003" /d:sonar.token="${{ inputs.sonar-token }}" /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx" /d:sonar.cs.opencover.reportsPaths="TestResults/**/*.opencover.xml"

    - name: Restore
      shell: bash
      run: dotnet restore TAF.slnx

    - name: Build
      shell: bash
      run: dotnet build TAF.slnx --configuration Release --no-restore

    - name: Test
      id: test_step
      continue-on-error: true
      shell: bash
      run: dotnet test TAF.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: End SonarCloud analysis
      shell: pwsh
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ inputs.sonar-token }}"

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: .NET Test Results
        path: TestResults/**/*.trx
        reporter: dotnet-trx

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: |
          Screenshots/**/*.png
          **/bin/**/Screenshots/**/*.png
        if-no-files-found: ignore

    - name: Fail if tests failed
      if: steps.test_step.outcome == 'failure'
      shell: bash
      run: exit 1
