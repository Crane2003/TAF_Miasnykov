name: Build and Test

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      TestConfiguration__BaseUrl: ${{ vars.TEST_BASE_URL }}
      TestConfiguration__ProjectName: ${{ vars.TEST_PROJECT_NAME }}
      TestConfiguration__Headless: "true"
      Credentials__DefaultUser__Username: ${{ vars.DEFAULT_USER_USERNAME }}
      Credentials__DefaultUser__Password: ${{ secrets.DEFAULT_USER_PASSWORD }}
      Credentials__AdminUser__Username: ${{ vars.ADMIN_USER_USERNAME }}
      Credentials__AdminUser__Password: ${{ secrets.ADMIN_USER_PASSWORD }}
      ApiConfiguration__BaseUrl: ${{ vars.API_BASE_URL }}
      ApiConfiguration__AuthToken: ${{ secrets.API_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: 'zulu'

      # - name: Install Chrome
      #   uses: browser-actions/setup-chrome@v1
      #   with:
      #     chrome-version: stable

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin /k:"Crane2003_TAF_Miasnykov" /o:"crane2003" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore
        run: dotnet restore TAF.slnx

      - name: Build
        run: dotnet build TAF.slnx --configuration Release --no-restore

      # - name: Test
      #   id: test_step
      #   continue-on-error: true
      #   run: dotnet test TAF.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      # - name: End SonarCloud analysis
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

